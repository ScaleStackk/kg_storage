services:
  neo4j:
    image: "${NEO4J_IMAGE:-questacase-neo4j:2026.10.1}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: questacase-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "${NEO4J_ADVERTISED_ADDRESS:-localhost}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1g}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-512m}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p '${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 8s
      start_period: 60s
      retries: 8
    mem_limit: "${NEO4J_MEMORY_LIMIT:-2g}"
    cpus: "${NEO4J_CPU_LIMIT:-2.0}"

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_backups:
